[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consult-to-note"
version = "0.2.0"
description = "Grounded clinical notes from doctor-patient conversations: every sentence cites the transcript, checked in code, approved by a clinician, exported as FHIR. Batch and real-time."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Maria (Anh Duong Vo)" }]
keywords = ["clinical-documentation", "ambient-scribe", "llm", "agents", "fhir", "nemotron", "nim"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "openai>=1.40",
  "langgraph>=0.3",
  "pydantic>=2.6",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "fhir.resources>=7.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Speech recognition with Parakeet through Riva (hosted endpoint or self-hosted NIM)
asr = ["nvidia-riva-client>=2.17"]
mic = ["nvidia-riva-client>=2.17", "pyaudio>=0.2.14"]
# NeMo Guardrails with Presidio for PHI masking. After install: python -m spacy download en_core_web_lg
guardrails = ["nemoguardrails[sdd]>=0.22"]
# NeMo Agent Toolkit: run, evaluate, profile and serve the workflow (also as an MCP server)
nat = ["nvidia-nat[langchain,eval,profiler,mcp]>=1.9"]
plot = ["matplotlib>=3.8"]
aiperf = ["aiperf>=0.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.16.10"]

[project.scripts]
c2n = "consult_to_note.cli:app"

[project.entry-points.'nat.components']
consult_to_note = "consult_to_note.nat_plugin.register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consult_to_note = ["guardrails_config/*.yml", "samples/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
